title: Quarto Bento
version: 0.1.0
quarto-required: '>=1.10.19'
contributes:
  project:
    project:
      type: default
      # Quarto 1.10 resolves bare extension hooks to absolute, unquoted commands.
      # Keep these fixed project-relative paths so spaces in the project are safe.
      pre-render: _extensions/qbento/pre.ts
      post-render: _extensions/qbento/post.ts
    filters:
      - guard.lua
    format: qbento-html
  formats:
    html:
      theme: none
      output-ext: qbento-stage.html
      fig-format: svg
      filters:
        - at: post-quarto
          path: capture.lua
